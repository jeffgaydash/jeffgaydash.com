<main>
<div class="page">
<div class="contact-form">
<h1>Contact</h1>
<p class="intro">Please complete the form below.</p>
<form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
<div class="form-row">
<div class="form-group">
<label for="first-name">First Name <span style="color:#bbb;">*</span></label>
<input autocomplete="given-name" id="first-name" name="first_name" required="" type="text"/>
</div>
<div class="form-group">
<label for="last-name">Last Name <span style="color:#bbb;">*</span></label>
<input autocomplete="family-name" id="last-name" name="last_name" required="" type="text"/>
</div>
</div>
<div class="form-group">
<label for="email">Email Address <span style="color:#bbb;">*</span></label>
<input autocomplete="email" id="email" name="email" required="" type="email"/>
</div>
<div class="form-group">
<label for="subject">Subject <span style="color:#bbb;">*</span></label>
<input id="subject" name="subject" required="" type="text"/>
</div>
<div class="form-group">
<label for="message">Message <span style="color:#bbb;">*</span></label>
<textarea id="message" name="message" required=""></textarea>
</div>
<button class="btn-submit" type="submit">Submit</button>
</form>
</div>
</div>
